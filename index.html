<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Özel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030108;
            font-family: 'Dancing Script', cursive;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .header-title {
            position: absolute;
            top: 6%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: #d880ff;
            font-size: clamp(2.2rem, 5vw, 4rem);
            text-shadow: 
                0 0 10px #b026ff,
                0 0 20px #b026ff,
                0 0 40px #8a2be2,
                0 0 80px #8a2be2;
            text-align: center;
            white-space: nowrap;
            pointer-events: none;
            letter-spacing: 2px;
            animation: pulseGlow 3s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% {
                text-shadow: 0 0 10px #b026ff, 0 0 20px #b026ff, 0 0 40px #8a2be2;
                opacity: 0.9;
            }
            100% {
                text-shadow: 0 0 15px #d880ff, 0 0 30px #b026ff, 0 0 60px #8a2be2, 0 0 90px #8a2be2;
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <h1 class="header-title">Çiçeği herkes alır hayatım</h1>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];
        let hearts = [];
        let mainFlowers = [];
        let starFlowers = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initScene();
        }

        // Yıldızlar
        class Star {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 1.8 + 0.5;
                this.alpha = Math.random();
                this.speed = Math.random() * 0.015 + 0.005;
                this.dir = Math.random() < 0.5 ? 1 : -1;
            }
            update() {
                this.alpha += this.speed * this.dir;
                if (this.alpha >= 1) {
                    this.alpha = 1;
                    this.dir = -1;
                } else if (this.alpha <= 0.1) {
                    this.alpha = 0.1;
                    this.dir = 1;
                }
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = "#e6ccff";
                ctx.shadowBlur = 8;
                ctx.shadowColor = "#b026ff";
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Kalp Etkileşimi
        class Heart {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = 0;
                this.maxSize = Math.random() * 22 + 18;
                this.alpha = 1;
                this.vy = Math.random() * 1.5 + 1;
                this.vx = (Math.random() - 0.5) * 1.2;
                this.growSpeed = Math.random() * 1.2 + 0.8;
                this.color = `hsl(${Math.random() * 40 + 270}, 100%, 75%)`;
            }
            update() {
                if (this.size < this.maxSize) {
                    this.size += this.growSpeed;
                }
                this.y -= this.vy;
                this.x += this.vx;
                this.alpha -= 0.012;
            }
            draw() {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = "#d880ff";
                
                ctx.beginPath();
                let s = this.size / 15;
                ctx.moveTo(this.x, this.y);
                ctx.bezierCurveTo(this.x - 6*s, this.y - 6*s, this.x - 12*s, this.y + 3*s, this.x, this.y + 11*s);
                ctx.bezierCurveTo(this.x + 12*s, this.y + 3*s, this.x + 6*s, this.y - 6*s, this.x, this.y);
                ctx.fill();
                ctx.restore();
            }
        }

        function initScene() {
            stars = [];
            const starCount = Math.floor((width * height) / 3000);
            for (let i = 0; i < starCount; i++) {
                stars.push(new Star());
            }

            // Çiçek Pozisyonları
            mainFlowers = [];
            starFlowers = [];
            
            const count = 35; 
            for (let i = 0; i < count; i++) {
                let progress = i / count;
                let y = height * 0.72 - (progress * height * 0.48) + (Math.random() * 20 - 10);
                let spread = (1 - progress * 0.75) * (width < 600 ? 110 : 170);
                let x = (Math.random() - 0.5) * spread;
                
                let scale = (1 - progress * 0.45) * (Math.random() * 0.3 + 0.85);
                let type = Math.random() < 0.65 ? 'main' : 'star';

                if (type === 'main') {
                    mainFlowers.push({ x, y, scale, phase: Math.random() * Math.PI * 2 });
                } else {
                    starFlowers.push({ x, y, scale: scale * 0.8, phase: Math.random() * Math.PI * 2 });
                }
            }

            // Ekstra Yıldız Çiçekleri (Dolgunluk için)
            for(let i = 0; i < 25; i++) {
                let progress = Math.random();
                let y = height * 0.75 - (progress * height * 0.5);
                let spread = (1 - progress * 0.7) * (width < 600 ? 130 : 190);
                let x = (Math.random() - 0.5) * spread;
                starFlowers.push({ x, y, scale: Math.random() * 0.4 + 0.4, phase: Math.random() * Math.PI * 2 });
            }

            // Z-index sıralaması (Derinlik hissi için)
            mainFlowers.sort((a, b) => a.y - b.y);
            starFlowers.sort((a, b) => a.y - b.y);
        }

        // Saplar ve Yapraklar
        function drawStems(sway) {
            ctx.save();
            ctx.strokeStyle = "rgba(40, 12, 65, 0.8)";
            ctx.lineWidth = 3;
            ctx.shadowBlur = 5;
            ctx.shadowColor = "#4a0e4e";

            let baseX = width / 2;
            let baseY = height + 20;

            mainFlowers.forEach(f => {
                ctx
